name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: test (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # Windows gates like every other entry. It spent v0.6.5 through
          # v0.9.0 as `experimental: true`, which made the job's red absorbed
          # into a green run — the failures were visible only to someone who
          # opened the log of a passing build.
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.30"

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check src tests

      - name: Type check
        run: uv run mypy src/skillpod

      - name: Test
        run: uv run pytest -q

      - name: Schema drift guard
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          uv run skillpod schema --output schemas/skillfile.schema.json
          git diff --exit-code -- schemas/skillfile.schema.json || (
            echo "::error::schemas/skillfile.schema.json is out of sync with src/skillpod/manifest/models.py."
            echo "Run 'uv run skillpod schema --output schemas/skillfile.schema.json' locally and commit."
            exit 1
          )

      - name: Smoke-test CLI import
        run: uv run python -c "from skillpod.cli import app; print('cli imports OK')"

  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.30"

      - name: Build
        run: uv build

      - name: Verify packaging metadata
        run: |
          uv run --with twine twine check dist/*
          python -m tarfile -l dist/skillpod-*.tar.gz | grep -E "LICENSE|README|py.typed" || (echo "missing required files in sdist" && exit 1)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
